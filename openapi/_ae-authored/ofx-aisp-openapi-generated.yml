      type: object
      properties:
        Data:
          type: object
          description: Accounts Read
        Data.Account:
          type: array
          description: Account
        Links:
          type: object
          description: Links relevant to the payload
        Links.Self:
          type: string
          description: required
        Links.First:
          type: string
        Links.Prev:
          type: string
        Links.Next:
          type: string
        Links.Last:
          type: string
        Meta:
          type: object
          description: Meta Data relevant to the payload
        Meta.TotalPages:
          type: integer
    PostRefreshTokenRequest:
      type: object
      properties:
        grant_type:
          type: string
        refresh_token:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        scope:
          type: string
    PostRefreshTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        refresh_token:
          type: string
        refresh_token_expires_in:
          type: integer
        token_type:
          type: string
    PostTokenRequest:
      type: object
      properties:
        client_id:
          type: string
          description: client identifier
        client_secret:
          type: string
          description: client secret password
        grant_type:
          type: string
          description: authorization grant flow. can be client_credentials or authorization_code or refresh_token
        scope:
          type: string
          description: the scope of the access request
      required:
      - client_id
      - client_secret
      - grant_type
      - scope
    PostTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        refresh_token:
          type: string
        refresh_token_expires_in:
          type: integer
        token_type:
          type: string
    PostV1OauthTokenRequest:
      type: object
      properties:
        client_id:
          type: string
          description: client identifier
        client_secret:
          type: string
          description: client secret password
        grant_type:
          type: string
          description: authorization grant flow. can be client_credentials or authorization_code or refresh_token
        scope:
          type: string
          description: the scope of the access request
      required:
      - client_id
      - client_secret
      - grant_type
      - scope
    PostV1OauthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        refresh_token:
          type: string
        refresh_token_expires_in:
