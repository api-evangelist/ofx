components:
  schemas:
    PostAuthorizationCodeResponse:
      type: object
      properties:
        Location:
          type: string
          description: User will get a token
    GetAuthorizeResponse:
      type: object
      properties:
        Location:
          type: string
          description: is sent only if user has entered username & password and allowed the App to access his information
    PostOpenBankingV31AispAccountAccessConsentsRequest:
      type: object
      properties:
        Data:
          type: object
          description: Data payload
        Data.Permissions:
          type: array
          description: Permissions list (>=1 items)
        Data.ExpirationDateTime:
          type: string
          description: Specified date and time the permissions will expire
        Data.TransactionFromDateTime:
          type: string
          description: Specified start date and time for the transaction query period
        Data.TransactionToDateTime:
          type: string
          description: Specified end date and time for the transaction query period
        Risk:
          type: object
          description: Risk section sent by the initiating party
      required:
      - Data
      - Data.Permissions
      - Risk
    PostOpenBankingV31AispAccountAccessConsentsResponse:
      type: object
      properties:
        '201':
          type: string
          description: Account Access Consents Created
        '400':
          type: string
          description: Bad Request
        '401':
          type: string
          description: Unauthorized
        '403':
          type: string
          description: Forbidden
        '404':
          type: string
          description: Not Found
        '429':
          type: string
          description: Too Many Requests
        '500':
          type: string
          description: Internal Server Error
